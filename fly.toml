# fly.toml app configuration file generated for valterra-crm on 2026-04-18T23:00:13-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'valterra-crm'
primary_region = 'dfw'

[build]

[deploy]
  release_command = '/app/scripts/release.sh'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
